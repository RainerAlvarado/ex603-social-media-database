<path d="M70 1510 H2030" stroke="#C92535" stroke-width="4"/>
<text x="70" y="1550" text-anchor="start" dominant-baseline="middle" font-size="22" fill="#002D62" font-weight="400">Rectangles: entities   •   Ovals: attributes   •   Diamonds: relationships   •   Underlined: primary key   •   FK: foreign key</text>
<text x="70" y="1590" text-anchor="start" dominant-baseline="middle" font-size="22" fill="#002D62" font-weight="400">Diamond 1:N = one-to-many. Beside each entity: (minimum, maximum) participation in that relationship.</text>
<text x="70" y="1630" text-anchor="start" dominant-baseline="middle" font-size="22" fill="#002D62" font-weight="400">(0,N) optional, many allowed   •   (1,1) exactly one required   •   (1,N) at least one required, many allowed</text>
<text x="70" y="1670" text-anchor="start" dominant-baseline="middle" font-size="21" fill="#002D62" font-weight="400">The two underlined post_hashtags attributes form one composite primary key. Detailed rules: schema-definition.md.</text>
